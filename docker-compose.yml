services:
  bot:
    build: .
    depends_on:
      - ollama
      - qdrant
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  ollama_data:
  qdrant_data:
